<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestión de trámites y reclamos · Municipalidad de San Miguel</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,200..400,0,0&display=swap" rel="stylesheet">
<style>
/* CRM municipal — estilos. Paleta: azul San Miguel + fondo oscuro tipo Creatio */
:root { --c-blue:#1CADE4; --c-blue-d:#0E8FC0; --c-side:linear-gradient(170deg,#243447,#0E5F82); --c-line:#e6e9ee; --c-soft:#f4f6f9; }
body { font-family:'Roboto',sans-serif; background:#243447; display:flex; min-height:100vh; }
.material-symbols-outlined { font-size:1.35rem; vertical-align:middle; font-variation-settings:'wght' 300; user-select:none; }
/* Lateral */
.side { width:230px; flex-shrink:0; background:var(--c-side); padding:1rem .75rem; color:#fff; }
.side-logo { display:flex; align-items:center; gap:.6rem; color:#fff; text-decoration:none; font-weight:500; margin-bottom:1.5rem; }
.side nav button { display:flex; align-items:center; gap:.75rem; width:100%; background:none; border:0; color:#dfe8f0; padding:.65rem .75rem; border-radius:8px; font-size:.95rem; text-align:left; }
.side nav button:hover, .side nav button.on { background:rgba(255,255,255,.16); color:#fff; }
.side nav .badge { margin-left:auto; }
/* Principal */
.main { flex:1; min-width:0; display:flex; flex-direction:column; background:var(--c-side); }
.top { display:flex; align-items:center; gap:.75rem; padding:.7rem 1rem; }
.search { display:flex; align-items:center; gap:.4rem; background:rgba(255,255,255,.16); border-radius:8px; padding:.3rem .7rem; color:#fff; flex:1; max-width:420px; }
.search input { background:none; border:0; outline:0; color:#fff; width:100%; }
.search input::placeholder { color:#cfe0ec; }
.avatar { width:34px; height:34px; border-radius:50%; background:var(--c-blue); display:flex; align-items:center; justify-content:center; font-size:.75rem; font-weight:700; }
.content { flex:1; background:#fff; border-radius:14px 0 0 0; margin-left:.5rem; padding:1.25rem; overflow:auto; }
/* KPIs */
.kpi { border-radius:8px; color:#fff; padding:.9rem 1.1rem; height:100%; }
.kpi b { display:block; font-size:2.6rem; line-height:1.1; font-weight:500; }
.kpi.b1{background:#0a5bd6}.kpi.b2{background:#e8590c}.kpi.b3{background:#2b8a3e}.kpi.b4{background:#5b6673}
.panel { border:1px solid var(--c-line); border-radius:10px; padding:1rem; background:#fff; }
.panel h2 { font-size:1.05rem; font-weight:500; margin-bottom:.75rem; }
.lbl { font-size:.78rem; color:#6b7076; margin:0; }
.val { margin-bottom:.7rem; padding-bottom:.35rem; border-bottom:1px dashed var(--c-line); }
/* Tabla */
.tbl { width:100%; font-size:.9rem; }
.tbl th { font-weight:500; color:#6b7076; font-size:.78rem; text-transform:uppercase; border-bottom:1px solid var(--c-line); padding:.5rem; }
.tbl td { padding:.6rem .5rem; border-bottom:1px solid var(--c-line); vertical-align:middle; }
.tbl tbody tr { cursor:pointer; } .tbl tbody tr:hover { background:var(--c-soft); }
/* Estados / prioridad */
.pill { font-size:.72rem; font-weight:500; padding:.15rem .6rem; border-radius:20px; background:#e7f5ff; color:#0b6fa4; white-space:nowrap; }
.pill.ok{background:#d3f9d8;color:#2b8a3e}.pill.warn{background:#fff3bf;color:#a86600}.pill.bad{background:#ffe3e3;color:#c92a2a}.pill.gray{background:#e9ecef;color:#495057}
.late { color:#c92a2a; font-weight:500; } .soon { color:#e8590c; font-weight:500; }
/* Etapas (estilo Creatio) */
.stages { display:flex; gap:2px; overflow-x:auto; margin:1rem 0; }
.stage { flex:1; min-width:120px; border:0; padding:.55rem 1rem .55rem 1.6rem; font-size:.85rem; background:#ced4da; color:#343a40; clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%,14px 50%); }
.stage:first-child { clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%); padding-left:1rem; }
.stage.done { background:#2b8a3e; color:#fff; } .stage.cur { background:#1c7c34; color:#fff; font-weight:500; }
/* Pestañas y timeline */
.tabs { display:flex; gap:1.25rem; border-bottom:1px solid var(--c-line); overflow-x:auto; }
.tabs button { background:none; border:0; border-bottom:2px solid transparent; padding:.6rem 0; color:var(--c-blue-d); font-size:.85rem; text-transform:uppercase; white-space:nowrap; }
.tabs button.on { color:#212529; border-color:#e8590c; }
.tl-item { display:flex; gap:.75rem; padding:.75rem 0; border-bottom:1px solid var(--c-line); }
.tl-ic { width:36px; height:36px; border-radius:50%; background:#e7f5ff; color:var(--c-blue-d); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.tl-ic.int { background:#fff3bf; color:#a86600; } .tl-ic.sys { background:#e9ecef; color:#495057; }
.rule { display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:.55rem 0; border-bottom:1px solid var(--c-line); font-size:.9rem; }
@media (max-width:767.98px) { .side { width:64px; } .side-logo span, .side nav span:not(.material-symbols-outlined) { display:none; } .content { margin-left:0; border-radius:14px 14px 0 0; padding:.9rem; } }
@media print { .side, .top, .stages, .tabs, .no-print { display:none !important; } body { background:#fff; } .content { margin:0; } }

.btn-primary { --bs-btn-bg:var(--c-blue); --bs-btn-border-color:var(--c-blue); --bs-btn-hover-bg:var(--c-blue-d); --bs-btn-hover-border-color:var(--c-blue-d); --bs-btn-active-bg:var(--c-blue-d); --bs-btn-color:#fff; --bs-btn-hover-color:#fff; }
.btn-outline-primary { --bs-btn-color:var(--c-blue-d); --bs-btn-border-color:var(--c-blue); --bs-btn-hover-bg:var(--c-blue); --bs-btn-hover-border-color:var(--c-blue); }
.btn .material-symbols-outlined { font-size:1.1rem; margin-right:.15rem; }
</style>
</head>
<body>
<!-- Menú lateral -->
<aside class="side" aria-label="Menú principal">
  <a href="index.html" class="side-logo" aria-label="Ir al portal"><img src="assets/msmlogo-circulo.svg" alt="" width="40" height="40" onerror="this.style.display='none'"><span>Gestión municipal</span></a>

</aside>

<div class="main">
  <!-- Barra superior -->
  <header class="top">
    <div class="search"><span class="material-symbols-outlined">search</span><input id="globalSearch" placeholder="Buscar por N°, asunto o ciudadano..." aria-label="Buscar casos"></div>
    <button class="btn btn-primary btn-sm d-flex align-items-center gap-1" data-act="nuevo"><span class="material-symbols-outlined">add</span><span class="d-none d-md-inline">Nuevo caso</span></button>
    <span class="ms-auto d-flex align-items-center gap-3 text-white">
      <span class="material-symbols-outlined" title="Notificaciones">notifications</span>
      <span class="material-symbols-outlined" title="Ayuda">help</span>
      <span class="avatar" title="Administrador">AD</span>

  </header>
  <main id="view" class="content"></main>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3"><div id="toast" class="toast text-bg-dark" role="status"><div class="toast-body" id="toastMsg"></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
/** crm.js — Lógica del CRM municipal (vistas: panel, bandeja, caso). */
(function () {
  var D = CRM, $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var ic = function (n) { return '<span class="material-symbols-outlined" aria-hidden="true">' + n + '</span>'; };
  var S = { view: 'panel', id: null, tab: 'com', f: { q: '', tipo: '', estado: '', asig: '', prio: '' } };
  var HOY = '28/09/2026';

  D.casos.forEach(function (c) {
    c.msgs = [{ k: 'ciud', who: c.ciudadano, t: c.desc, at: HOY + ' 09:10' }];
    c.hist = [{ t: 'Caso creado por ' + c.canal, at: HOY + ' 09:10' }];
  });

  function toast(m) { $('#toastMsg').textContent = m; bootstrap.Toast.getOrCreateInstance($('#toast'), { delay: 2600 }).show(); }
  function caso() { return D.casos.find(function (c) { return c.id === S.id; }); }
  function abierto(c) { return ['Aprobado', 'Denegado', 'Cancelado'].indexOf(c.estado) < 0; }
  function log(c, t) { c.hist.unshift({ t: t, at: HOY + ' ' + new Date().toTimeString().slice(0, 5) }); }
  function pillEstado(e) { var k = e === 'Aprobado' ? 'ok' : (e === 'Denegado' || e === 'Cancelado') ? 'bad' : e === 'Ajuste de información' ? 'warn' : ''; return '<span class="pill ' + k + '">' + esc(e) + '</span>'; }
  function pillPrio(p) { return '<span class="pill ' + (p === 'Alta' ? 'bad' : p === 'Media' ? 'warn' : 'gray') + '">' + p + '</span>'; }
  function plazo(c) {
    if (!abierto(c)) return '<span class="text-secondary">—</span>';
    var h = c.venceH;
    if (h < 0) return '<span class="late">Vencido hace ' + (-h) + ' h</span>';
    var t = Math.floor(h / 24) + 'd ' + String(h % 24).padStart(2, '0') + ':00';
    return '<span class="' + (h <= 24 ? 'soon' : '') + '">' + t + '</span>';
  }

  /* ---------- Menú lateral ---------- */
  function nav() {
    var abiertos = D.casos.filter(abierto).length;
    var items = [['panel', 'home', 'Panel'], ['bandeja', 'inbox', 'Bandeja de casos'], ['notif', 'mark_email_unread', 'Domicilio electrónico'], ['ciud', 'groups', 'Ciudadanos'], ['ajustes', 'settings', 'Configuración']];
    $('#sideNav').innerHTML = items.map(function (i) {
      return '<button data-go="' + i[0] + '" class="' + (S.view === i[0] || (S.view === 'caso' && i[0] === 'bandeja') ? 'on' : '') + '">' + ic(i[1]) + '<span>' + i[2] + '</span>' +
        (i[0] === 'bandeja' ? '<span class="badge rounded-pill bg-danger">' + abiertos + '</span>' : '') + '</button>';
    }).join('');
  }

  /* ---------- Panel ---------- */
  function panel() {
    var ab = D.casos.filter(abierto);
    var k = [['b1', ab.length, 'Casos abiertos'], ['b2', ab.filter(function (c) { return c.venceH <= 24; }).length, 'Vencidos o por vencer (24 h)'], ['b3', D.casos.filter(function (c) { return c.estado === 'Aprobado'; }).length, 'Resueltos'], ['b4', ab.filter(function (c) { return !c.asig; }).length, 'Sin asignar']];
    var mios = ab.filter(function (c) { return c.asig === D.yo; }).sort(function (a, b) { return a.venceH - b.venceH; });
    return '<h1 class="h4 mb-3">Buen día, ' + esc(D.yo.split(' ')[0]) + '</h1>' +
      '<div class="row g-3 mb-3">' + k.map(function (x) { return '<div class="col-6 col-lg-3"><div class="kpi ' + x[0] + '"><small>' + x[2] + '</small><b>' + x[1] + '</b></div></div>'; }).join('') + '</div>' +
      '<div class="row g-3"><div class="col-lg-7"><div class="panel"><h2>Mis pendientes</h2>' + (mios.length ? tabla(mios) : '<p class="text-secondary mb-0">No tenés casos pendientes.</p>') + '</div></div>' +
      '<div class="col-lg-5"><div class="panel"><h2>Automatizaciones</h2>' + D.reglas.map(function (r) {
        return '<div class="rule"><span>' + esc(r.t) + '</span><div class="form-check form-switch m-0"><input class="form-check-input" type="checkbox" role="switch" data-regla="' + r.id + '"' + (r.on ? ' checked' : '') + ' aria-label="' + esc(r.t) + '"></div></div>';
      }).join('') + '</div></div></div>';
  }

  /* ---------- Bandeja ---------- */
  function filtrar() {
    var f = S.f, q = f.q.toLowerCase();
    return D.casos.filter(function (c) {
      return (!q || (c.id + ' ' + c.asunto + ' ' + c.ciudadano).toLowerCase().indexOf(q) > -1) && (!f.tipo || c.tipo === f.tipo) && (!f.estado || c.estado === f.estado) &&
        (!f.prio || c.prio === f.prio) && (!f.asig || (f.asig === 'mios' ? c.asig === D.yo : !c.asig));
    });
  }
  function tabla(list) {
    if (!list.length) return '<p class="text-secondary py-3 mb-0">No hay casos con esos filtros.</p>';
    return '<div class="table-responsive"><table class="tbl"><thead><tr><th>N°</th><th>Asunto</th><th>Tipo</th><th>Prioridad</th><th>Estado</th><th>Plazo</th><th>Asignado</th></tr></thead><tbody>' +
      list.map(function (c) {
        return '<tr data-caso="' + c.id + '" tabindex="0"><td class="text-nowrap">' + c.id + '</td><td><b>' + esc(c.asunto) + '</b><br><small class="text-secondary">' + esc(c.ciudadano) + '</small></td><td>' + c.tipo + '</td><td>' + pillPrio(c.prio) + '</td><td>' + pillEstado(c.estado) + '</td><td>' + plazo(c) + '</td><td>' + (esc(c.asig) || '<span class="text-secondary">Sin asignar</span>') + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }
  function opts(arr, sel, ph) { return '<option value="">' + ph + '</option>' + arr.map(function (a) { return '<option' + (a === sel ? ' selected' : '') + '>' + a + '</option>'; }).join(''); }
  function bandeja() {
    var f = S.f;
    return '<h1 class="h4 mb-3">Bandeja de casos</h1><div class="panel mb-3"><div class="row g-2">' +
      '<div class="col-md-3"><input class="form-control form-control-sm" data-f="q" placeholder="N°, asunto o ciudadano" value="' + esc(f.q) + '"></div>' +
      '<div class="col-6 col-md-2"><select class="form-select form-select-sm" data-f="tipo">' + opts(D.tipos, f.tipo, 'Tipo') + '</select></div>' +
      '<div class="col-6 col-md-2"><select class="form-select form-select-sm" data-f="estado">' + opts(D.etapas.concat(D.cierres), f.estado, 'Estado') + '</select></div>' +
      '<div class="col-6 col-md-2"><select class="form-select form-select-sm" data-f="prio">' + opts(['Alta', 'Media', 'Baja'], f.prio, 'Prioridad') + '</select></div>' +
      '<div class="col-6 col-md-2"><select class="form-select form-select-sm" data-f="asig"><option value="">Asignado: todos</option><option value="mios"' + (f.asig === 'mios' ? ' selected' : '') + '>Asignados a mí</option><option value="sin"' + (f.asig === 'sin' ? ' selected' : '') + '>Sin asignar</option></select></div>' +
      '<div class="col-md-1"><button class="btn btn-outline-secondary btn-sm w-100" data-act="limpiar">Limpiar</button></div></div></div>' +
      '<div class="panel" id="lista">' + tabla(filtrar()) + '</div>';
  }

  /* ---------- Detalle del caso ---------- */
  function caseView() {
    var c = caso(); if (!c) return bandeja();
    var idx = D.etapas.indexOf(c.estado), cerrado = D.cierres.indexOf(c.estado) > -1;
    var stages = D.etapas.map(function (e, i) { return '<button class="stage ' + (i < idx ? 'done' : i === idx ? 'cur' : '') + '" data-estado="' + e + '"' + (cerrado ? ' disabled' : '') + '>' + e + '</button>'; }).join('');
    var tabs = [['com', 'Comunicación'], ['datos', 'Datos del caso'], ['docs', 'Documentación'], ['hist', 'Historial'], ['cierre', 'Cierre']];
    return '<div class="d-flex flex-wrap align-items-center gap-2">' +
      '<button class="btn btn-link p-0" data-go="bandeja" aria-label="Volver">' + ic('arrow_back') + '</button><h1 class="h4 mb-0">' + esc(c.tipo) + ' #' + c.id + ' — ' + esc(c.asunto) + '</h1>' +
      '<span class="ms-auto d-flex gap-2 no-print"><button class="btn btn-outline-secondary btn-sm" data-act="imprimir">' + ic('print') + ' Imprimir comprobante</button></span></div>' +
      '<div class="mt-2">' + pillEstado(c.estado) + ' ' + pillPrio(c.prio) + ' ' + c.tags.map(function (t) { return '<span class="pill gray">' + esc(t) + '</span>'; }).join(' ') + '</div>' +
      '<div class="stages no-print">' + stages + '</div>' +
      '<div class="row g-3"><div class="col-lg-4">' +
      '<div class="panel mb-3"><h2>Plazos</h2><p class="lbl">Tiempo restante para resolver</p><div class="val fs-4">' + plazo(c) + '</div>' +
      '<p class="lbl">Área responsable</p><div class="val">' + esc(c.area) + '</div><p class="lbl">Asignado a</p><div class="val">' + (esc(c.asig) || 'Sin asignar') + '</div>' +
      '<div class="d-flex gap-2 no-print"><button class="btn btn-outline-primary btn-sm" data-act="escalar">' + ic('campaign') + ' Escalar</button><button class="btn btn-outline-primary btn-sm" data-act="asignarme">' + ic('person') + ' Asignarme</button></div></div>' +
      '<div class="panel"><h2>Ciudadano</h2><p class="lbl">Nombre</p><div class="val">' + esc(c.ciudadano) + '</div><p class="lbl">Teléfono</p><div class="val">' + esc(c.tel) + '</div><p class="lbl">Correo</p><div class="val">' + esc(c.mail) + '</div><p class="lbl">Canal de ingreso</p><div class="mb-0">' + esc(c.canal) + '</div></div>' +
      '</div><div class="col-lg-8"><div class="panel"><div class="tabs">' + tabs.map(function (t) { return '<button data-tab="' + t[0] + '" class="' + (S.tab === t[0] ? 'on' : '') + '">' + t[1] + '</button>'; }).join('') + '</div><div class="pt-3">' + tabBody(c) + '</div></div></div></div>';
  }
  function tabBody(c) {
    if (S.tab === 'com') {
      return '<textarea id="msgTxt" class="form-control mb-2" rows="3" placeholder="Escribí un mensaje al ciudadano o una nota interna..."></textarea>' +
        '<div class="d-flex flex-wrap align-items-center gap-3 mb-2 no-print"><div class="form-check"><input class="form-check-input" type="checkbox" id="msgInt"><label class="form-check-label small" for="msgInt">Nota interna (no la ve el ciudadano)</label></div>' +
        '<button class="btn btn-primary btn-sm ms-auto" data-act="enviar">' + ic('send') + ' Enviar</button></div>' +
        '<p class="small text-secondary">Los mensajes al ciudadano llegan a su domicilio electrónico y también por mail de cortesía.</p>' +
        c.msgs.map(function (m) {
          var t = m.k === 'int' ? 'int' : m.k === 'sys' ? 'sys' : '';
          return '<div class="tl-item"><div class="tl-ic ' + t + '">' + ic(m.k === 'ciud' ? 'person' : m.k === 'int' ? 'lock' : m.k === 'sys' ? 'settings' : 'support_agent') + '</div><div><b>' + esc(m.who) + '</b>' + (m.k === 'int' ? ' <span class="pill warn">Nota interna</span>' : '') + '<br><small class="text-secondary">' + m.at + '</small><p class="mb-0 mt-1">' + esc(m.t) + '</p></div></div>';
        }).join('');
    }
    if (S.tab === 'datos') return '<p class="lbl">Descripción</p><div class="val">' + esc(c.desc) + '</div><div class="row"><div class="col-md-6"><p class="lbl">Categoría</p><div class="val">' + esc(c.cat) + '</div></div><div class="col-md-6"><p class="lbl">Ubicación</p><div class="val">' + (esc(c.dir) || '—') + '</div></div></div>';
    if (S.tab === 'docs') {
      if (!c.docs.length) return '<p class="text-secondary mb-0">Este caso no requiere documentación respaldatoria.</p>';
      return c.docs.map(function (d, i) {
        var k = d[2] === 'Aprobado' ? 'ok' : d[2] === 'Observado' ? 'bad' : 'warn';
        return '<div class="rule"><span>' + ic('description') + ' ' + esc(d[0]) + (d[1] ? ' <b class="text-danger" title="Obligatorio">*</b>' : '') + '</span><span class="d-flex align-items-center gap-2"><span class="pill ' + k + '">' + d[2] + '</span>' +
          (d[2] !== 'Aprobado' ? '<button class="btn btn-outline-primary btn-sm no-print" data-ajuste="' + i + '">Solicitar ajuste</button>' : '') + '</span></div>';
      }).join('') + '<p class="small text-secondary mt-2">Al solicitar un ajuste, el caso pasa a "Ajuste de información" y el ciudadano recibe la notificación.</p>';
    }
    if (S.tab === 'hist') return c.hist.map(function (h) { return '<div class="tl-item"><div class="tl-ic sys">' + ic('history') + '</div><div>' + esc(h.t) + '<br><small class="text-secondary">' + h.at + '</small></div></div>'; }).join('');
    return '<p class="lbl">Resultado / respuesta de cierre</p><textarea id="cierreTxt" class="form-control mb-3" rows="4" placeholder="Detalle de la resolución que verá el ciudadano..."></textarea>' +
      '<div class="d-flex flex-wrap gap-2 no-print"><button class="btn btn-success btn-sm" data-cierre="Aprobado">' + ic('check') + ' Aprobar y cerrar</button><button class="btn btn-outline-danger btn-sm" data-cierre="Denegado">' + ic('block') + ' Denegar</button><button class="btn btn-outline-secondary btn-sm" data-cierre="Cancelado">' + ic('cancel') + ' Cancelar caso</button></div>' +
      '<p class="small text-secondary mt-2">Una vez cerrado el caso, el ciudadano recibe el resultado en su domicilio electrónico y ya no se puede cancelar.</p>';
  }

  /* ---------- Vistas simples ---------- */
  function simple(t, ico, txt) { return '<h1 class="h4 mb-3">' + t + '</h1><div class="panel text-center py-5 text-secondary">' + ic(ico) + '<p class="mb-0 mt-2">' + txt + '</p></div>'; }

  function render() {
    var v = { panel: panel, bandeja: bandeja, caso: caseView,
      notif: function () { return simple('Domicilio electrónico', 'mark_email_unread', 'Aquí se listarán las notificaciones enviadas a los ciudadanos (próximamente).'); },
      ciud: function () { return simple('Ciudadanos', 'groups', 'Aquí se listarán los ciudadanos y sus casos (próximamente).'); },
      ajustes: function () { return simple('Configuración', 'settings', 'Aquí se configurarán áreas, equipos y plazos (próximamente).'); } };
    $('#view').innerHTML = v[S.view](); nav();
  }
  function go(view, id) { S.view = view; if (id) { S.id = id; S.tab = 'com'; } render(); window.scrollTo(0, 0); }
  function cambiarEstado(c, e) { c.estado = e; log(c, 'Estado cambiado a "' + e + '"'); c.msgs.unshift({ k: 'sys', who: 'Sistema', t: 'Estado: ' + e + '. Se notificó al domicilio electrónico del ciudadano.', at: HOY }); toast('Estado actualizado: ' + e); }

  /* ---------- Eventos ---------- */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-go],[data-caso],[data-tab],[data-estado],[data-act],[data-ajuste],[data-cierre]'); if (!t) return;
    var d = t.dataset, c = S.id ? caso() : null;
    if (d.go) return go(d.go);
    if (d.caso) return go('caso', d.caso);
    if (d.tab) { S.tab = d.tab; return render(); }
    if (d.estado) { cambiarEstado(c, d.estado); return render(); }
    if (d.ajuste !== undefined) { c.docs[d.ajuste][2] = 'Observado'; cambiarEstado(c, 'Ajuste de información'); return render(); }
    if (d.cierre) { var r = ($('#cierreTxt') || {}).value || ''; cambiarEstado(c, d.cierre); if (r) c.msgs.unshift({ k: 'mun', who: D.yo, t: r, at: HOY }); return render(); }
    switch (d.act) {
      case 'limpiar': S.f = { q: '', tipo: '', estado: '', asig: '', prio: '' }; return render();
      case 'nuevo': return toast('Formulario de nuevo caso: próximamente.');
      case 'imprimir': return window.print();
      case 'asignarme': c.asig = D.yo; log(c, 'Asignado a ' + D.yo); toast('Caso asignado a vos'); return render();
      case 'escalar': c.prio = 'Alta'; log(c, 'Caso escalado a prioridad alta'); toast('Caso escalado'); return render();
      case 'enviar':
        var txt = $('#msgTxt').value.trim(); if (!txt) return toast('Escribí un mensaje primero.');
        var int = $('#msgInt').checked; c.msgs.unshift({ k: int ? 'int' : 'mun', who: D.yo, t: txt, at: HOY }); log(c, int ? 'Nota interna agregada' : 'Mensaje enviado al ciudadano');
        toast(int ? 'Nota guardada' : 'Mensaje enviado al domicilio electrónico'); return render();
    }
  });
  document.addEventListener('input', function (e) {
    var f = e.target.dataset.f; if (!f) return;
    S.f[f] = e.target.value; $('#lista').innerHTML = tabla(filtrar());
  });
  document.addEventListener('change', function (e) {
    var r = e.target.dataset.regla; if (r) { var x = D.reglas.find(function (a) { return a.id === r; }); x.on = e.target.checked; toast('Automatización ' + (x.on ? 'activada' : 'desactivada')); }
    else if (e.target.dataset.f) { S.f[e.target.dataset.f] = e.target.value; $('#lista').innerHTML = tabla(filtrar()); }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.dataset.caso) go('caso', e.target.dataset.caso); });
  $('#globalSearch').addEventListener('input', function (e) { S.f.q = e.target.value; if (S.view !== 'bandeja') { S.view = 'bandeja'; render(); $('[data-f="q"]').value = S.f.q; $('[data-f="q"]').focus(); } });
  render();
})();

</script>
</body>
</html>
