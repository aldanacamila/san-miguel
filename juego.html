<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,200..400,0,0&display=swap" rel="stylesheet">
<link href="css/styles.css" rel="stylesheet">
<title>Aprendé a usar las apps · Municipalidad de San Miguel</title>
</head>
<body data-page="juego">

<div id="app-header"></div>
<div id="app-a11y"></div>

<main class="container py-4" style="max-width:640px">

  <!-- Intro -->
  <section id="juego-intro">
    <a href="index.html" class="d-inline-block mb-3 small text-secondary">← Volver</a>
    <div class="card p-4">
      <h1 class="h3">Aprendé a usar las apps</h1>
      <p class="text-secondary">Respondé preguntas sencillas sobre Mercado Pago, WhatsApp, Mi Argentina y home banking. No hay apuro ni penalidad: es para practicar.</p>
      <div><button class="btn btn-primary" data-action="juego-iniciar">Empezar</button></div>
    </div>
  </section>

  <!-- Pregunta -->
  <section id="juego-pregunta" class="d-none">
    <div class="progress mb-3" id="progress" role="progressbar" aria-label="Progreso del juego" aria-valuemin="0" aria-valuemax="100" style="height:8px">
      <div class="progress-bar" id="progress-bar" style="width:0%"></div>
    </div>
    <div class="card p-4">
      <h2 class="h4 mb-3" id="pregunta-texto"></h2>
      <div id="opciones"></div>
      <p id="feedback" class="feedback" role="status"></p>
      <div><button class="btn btn-primary d-none" id="btn-siguiente" data-action="juego-siguiente">Siguiente</button></div>
    </div>
  </section>

  <!-- Resultado -->
  <section id="juego-resultado" class="d-none text-center">
    <div class="card p-4">
      <h2 class="h3">¡Terminaste!</h2>
      <p class="score-num mb-1" id="score-final"></p>
      <p id="score-msg"></p>
      <div class="d-flex flex-wrap gap-2 justify-content-center">
        <button class="btn btn-outline-primary btn-sm" data-action="juego-iniciar">Jugar de nuevo</button>
        <button class="btn btn-primary btn-sm d-none" id="btn-repasar" data-action="juego-repasar">Repasar solo lo que fallé</button>
        <a class="btn btn-primary btn-sm" href="index.html">Volver</a>
      </div>
    </div>
  </section>
</main>

<div id="app-footer"></div>
<div id="app-floating"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/utils.js"></script>
<script src="js/data.js"></script>
<script src="js/components.js"></script>
<script src="js/accesibilidad.js"></script>
<script src="js/asistente.js"></script>
<script src="js/juego.js"></script>
</body>
</html>
